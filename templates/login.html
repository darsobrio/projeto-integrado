{% extends 'base.html' %}
{% block title %}Entrar - Oportunet{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <h1 class="page-title mb-1">Entrar</h1>
            <p class="text-muted mb-0">Acesse sua conta para continuar.</p>
        </div>

        <div class="card-flat p-4 p-md-5">
            <form method="POST">
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" name="username" placeholder="voce@email.com" required autofocus autocomplete="email">
                </div>
                <div class="mb-4">
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <input type="password" id="senhaInput" class="form-control" name="password" placeholder="Sua senha" required autocomplete="current-password">
                        <button class="btn btn-ghost" type="button" onclick="toggleSenha()" title="Mostrar senha"><i id="senhaIcone" class="bi bi-eye"></i></button>
                    </div>
                </div>
                <button class="btn btn-accent w-100 py-2" type="submit">Entrar</button>
            </form>

            <div class="text-center mt-4">
                <small class="text-muted">Não tem conta? <a href="{% url 'core:register' %}" class="text-accent fw-medium">Criar conta</a></small>
            </div>
        </div>
    </div>
</section>
<script>
function toggleSenha() {
    const input = document.getElementById('senhaInput');
    const icone = document.getElementById('senhaIcone');
    if (input.type === 'password') { input.type = 'text'; icone.className = 'bi bi-eye-slash'; }
    else { input.type = 'password'; icone.className = 'bi bi-eye'; }
}
</script>
{% endblock %}
