{% extends 'base.html' %}
{% block title %}Criar conta - Oportunet{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width: 760px;">
        <div class="mb-4">
            <h1 class="page-title mb-1">Criar conta</h1>
            <p class="text-muted mb-0">Escolha seu perfil e informe seus dados. É gratuito.</p>
        </div>

        <form method="POST" class="card-flat p-4 p-md-5">
            {% csrf_token %}

            <h2 class="h6 fw-semibold mb-3">Tipo de conta</h2>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <input type="radio" class="btn-check" name="tipo_usuario" id="tipoCandidato" value="candidato" checked>
                    <label class="btn btn-ghost w-100 py-3 text-start" for="tipoCandidato">
                        <strong class="d-block">Candidato</strong>
                        <small class="text-muted">Buscar vagas e imóveis</small>
                    </label>
                </div>
                <div class="col-md-4">
                    <input type="radio" class="btn-check" name="tipo_usuario" id="tipoEmpresa" value="empresa">
                    <label class="btn btn-ghost w-100 py-3 text-start" for="tipoEmpresa">
                        <strong class="d-block">Empresa</strong>
                        <small class="text-muted">Publicar vagas</small>
                    </label>
                </div>
                <div class="col-md-4">
                    <input type="radio" class="btn-check" name="tipo_usuario" id="tipoProprietario" value="proprietario">
                    <label class="btn btn-ghost w-100 py-3 text-start" for="tipoProprietario">
                        <strong class="d-block">Proprietário</strong>
                        <small class="text-muted">Anunciar imóveis</small>
                    </label>
                </div>
            </div>

            <h2 class="h6 fw-semibold mb-3">Dados</h2>
            <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <label class="form-label">Nome completo *</label>
                    <input type="text" name="nome_completo" class="form-control" placeholder="Seu nome" required minlength="3">
                </div>
                <div class="col-md-4">
                    <label class="form-label">CPF / CNPJ</label>
                    <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00" maxlength="18">
                </div>
                <div class="col-md-6">
                    <label class="form-label">E-mail *</label>
                    <input type="email" name="email" class="form-control" placeholder="voce@email.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Telefone</label>
                    <input type="tel" name="telefone" class="form-control" placeholder="(00) 00000-0000" maxlength="15">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Data de nascimento</label>
                    <input type="date" name="data_nascimento" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Cidade</label>
                    <input type="text" name="cidade" class="form-control" value="Paulistana - PI">
                </div>
            </div>

            <h2 class="h6 fw-semibold mb-3">Senha</h2>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Senha *</label>
                    <div class="input-group">
                        <input type="password" id="pw1" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
                        <button class="btn btn-ghost" type="button" onclick="verPw('pw1','ic1')"><i id="ic1" class="bi bi-eye"></i></button>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirmar senha *</label>
                    <div class="input-group">
                        <input type="password" id="pw2" name="password_confirm" class="form-control" placeholder="Repita a senha" required minlength="6">
                        <button class="btn btn-ghost" type="button" onclick="verPw('pw2','ic2')"><i id="ic2" class="bi bi-eye"></i></button>
                    </div>
                    <div class="text-danger small mt-1" id="pwErro" style="display:none;">As senhas não são iguais.</div>
                </div>
            </div>

            <div class="divider pt-4 d-flex flex-column flex-sm-row justify-content-sm-between align-items-sm-center gap-2">
                <a href="{% url 'core:login' %}" class="text-muted small">Já tenho conta</a>
                <button type="submit" class="btn btn-accent px-4 py-2">Criar conta</button>
            </div>
        </form>
    </div>
</section>
<script>
function verPw(id, ic) {
    const i = document.getElementById(id); const icn = document.getElementById(ic);
    if (i.type === 'password') { i.type = 'text'; icn.className = 'bi bi-eye-slash'; }
    else { i.type = 'password'; icn.className = 'bi bi-eye'; }
}
(() => {
    const f = document.querySelector('form');
    const pw1 = document.getElementById('pw1'); const pw2 = document.getElementById('pw2'); const err = document.getElementById('pwErro');
    f.addEventListener('submit', e => {
        if (pw1.value !== pw2.value) {
            e.preventDefault();
            err.style.display = 'block';
        } else {
            err.style.display = 'none';
        }
    });
})();
</script>
{% endblock %}
